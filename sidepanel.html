<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hex-Text Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      /* ── Reset & Base ─────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg:          #f0f2f8;
        --surface:     #ffffff;
        --surface-2:   #f7f8fc;
        --border:      #e2e5ef;
        --text-primary:#1a1d2e;
        --text-muted:  #6b7280;
        --accent:      #4f6ef7;
        --accent-dark: #3a58e0;
        --green:       #22c55e;
        --green-dark:  #16a34a;
        --red:         #ef4444;
        --red-dark:    #dc2626;
        --shadow-sm:   0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
        --shadow-md:   0 4px 12px rgba(0,0,0,.10), 0 2px 4px rgba(0,0,0,.06);
        --radius:      12px;
        --radius-sm:   8px;
        --transition:  0.2s ease;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg:          #0f1117;
          --surface:     #1a1d2e;
          --surface-2:   #1f2235;
          --border:      #2d3148;
          --text-primary:#e8eaf6;
          --text-muted:  #8b90b5;
          --accent:      #6b8aff;
          --accent-dark: #5572f5;
          --green:       #4ade80;
          --green-dark:  #22c55e;
          --red:         #f87171;
          --red-dark:    #ef4444;
          --shadow-sm:   0 1px 3px rgba(0,0,0,.35);
          --shadow-md:   0 4px 16px rgba(0,0,0,.45);
        }
      }

      html, body {
        height: 100%;
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        background-color: var(--bg);
        color: var(--text-primary);
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Layout ───────────────────────────────────── */
      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        padding: 14px;
        gap: 10px;
      }

      /* ── Header ───────────────────────────────────── */
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 0 6px;
        border-bottom: 1px solid var(--border);
      }

      .header-icon {
        width: 28px;
        height: 28px;
        background: linear-gradient(135deg, var(--accent) 0%, #a78bfa 100%);
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        flex-shrink: 0;
      }

      .header h1 {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-primary);
        letter-spacing: -0.2px;
      }

      /* ── Section ──────────────────────────────────── */
      .section {
        display: flex;
        flex-direction: column;
        flex: 1;
        gap: 6px;
        min-height: 0;
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }

      .section-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }

      .section-actions {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      /* ── Textarea ─────────────────────────────────── */
      textarea {
        flex: 1;
        width: 100%;
        min-height: 110px;
        padding: 10px 12px;
        background-color: var(--surface);
        color: var(--text-primary);
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
        font-size: 13px;
        line-height: 1.6;
        resize: none;
        outline: none;
        transition: border-color var(--transition), box-shadow var(--transition);
        box-shadow: var(--shadow-sm);
      }

      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.15);
      }

      textarea::placeholder {
        color: var(--text-muted);
        opacity: 0.7;
      }

      /* ── Buttons ──────────────────────────────────── */
      button {
        font-family: inherit;
        font-size: 12px;
        font-weight: 500;
        border: none;
        cursor: pointer;
        border-radius: var(--radius-sm);
        transition: background-color var(--transition), transform var(--transition), opacity var(--transition);
        white-space: nowrap;
      }

      button:active { transform: scale(0.96); }

      /* Copy buttons (nhỏ, nằm trong section-header) */
      .btn-copy {
        padding: 4px 12px;
        background-color: var(--surface);
        color: var(--text-muted);
        border: 1.5px solid var(--border);
        line-height: 1.8;
      }

      .btn-copy:hover {
        background-color: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .btn-copy.copied {
        background-color: var(--green);
        border-color: var(--green);
        color: #fff;
      }

      /* Open-link button (ẩn mặc định) */
      .btn-link {
        padding: 4px 12px;
        background-color: transparent;
        color: var(--accent);
        border: 1.5px solid var(--accent);
        line-height: 1.8;
      }

      .btn-link:hover {
        background-color: var(--accent);
        color: #fff;
      }

      .btn-link.hidden { display: none; }

      /* Clear button (chính giữa) */
      .btn-clear {
        width: 100%;
        padding: 8px;
        background-color: var(--surface-2);
        color: var(--text-muted);
        border: 1.5px solid var(--border);
        font-size: 13px;
        border-radius: var(--radius);
        transition: background-color var(--transition), color var(--transition);
      }

      .btn-clear:hover {
        background-color: var(--red);
        border-color: var(--red);
        color: #fff;
      }

      /* ── Divider ──────────────────────────────────── */
      .divider {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 500;
      }

      .divider::before, .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border);
      }
    </style>
  </head>
  <body>
    <div class="app">

      <!-- Header -->
      <header class="header">
        <div class="header-icon">⬡</div>
        <h1>Hex-Text Converter</h1>
      </header>

      <!-- Text Section -->
      <div class="section">
        <div class="section-header">
          <span class="section-label">Văn bản</span>
          <div class="section-actions">
            <button class="btn-link hidden" id="openLink">🔗 Mở liên kết</button>
            <button class="btn-copy" id="copyText">Sao chép</button>
          </div>
        </div>
        <textarea id="textInput" placeholder="Nhập văn bản tại đây..."></textarea>
      </div>

      <!-- Middle divider + clear -->
      <div class="divider">⇅ Tự động chuyển đổi</div>
      <button class="btn-clear" id="clearAll">🗑 Xóa tất cả</button>

      <!-- Hex Section -->
      <div class="section">
        <div class="section-header">
          <span class="section-label">Mã Hex</span>
          <button class="btn-copy" id="copyHex">Sao chép</button>
        </div>
        <textarea id="hexInput" placeholder="Nhập mã hex tại đây..."></textarea>
      </div>

    </div>
    <script src="sidepanel.js"></script>
  </body>
</html>
